<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Longevity Concierge</title>
<meta name="description" content="Small habits, big life. Habit tracking, food log, moves and an accountability circle.">
<meta name="theme-color" content="#0f3b33">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Longevity Concierge">
<style>
  html{color-scheme:light}
  body{margin:0;font-size:14px;padding-top:env(safe-area-inset-top,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"><p style="padding:40px 16px;font-family:system-ui">Loading…</p></div>
<div class="tabs" id="tabs" hidden><nav aria-label="Main">
  <button class="tab on" data-tab="today" id="tab-today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button class="tab" data-tab="food" id="tab-food"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7.5c0-1.5 1-2 1-3.5M12 7.5c0-1.5 1-2 1-3.5M16 7.5c0-1.5 1-2 1-3.5"/></svg>Food</button>
  <button class="tab" data-tab="learn" id="tab-learn"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Learn</button>
  <button class="tab" data-tab="circle" id="tab-circle"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>Circle</button>
  <button class="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17l-6.1 3.5 1.5-6.8L2.2 9l6.9-.7z"/></svg>Plan</button>
</nav></div>
<noscript>Longevity Concierge needs JavaScript turned on.</noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
